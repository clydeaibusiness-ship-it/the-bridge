<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <path id="star-lg" d="M0,-24 L3,-3 L24,0 L3,3 L0,24 L-3,3 L-24,0 L-3,-3 Z"/>
    <path id="star-md" d="M0,-14 L2,-2 L14,0 L2,2 L0,14 L-2,2 L-14,0 L-2,-2 Z"/>
    <path id="star-sm" d="M0,-6 L1,-1 L6,0 L1,1 L0,6 L-1,1 L-6,0 L-1,-1 Z"/>

    <radialGradient id="wisp-fade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="currentColor" stop-opacity="0"/>
    </radialGradient>

    <filter id="star-glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Wisp formations -->
  <ellipse cx="200" cy="150" rx="300" ry="80" fill="url(#wisp-fade)" transform="rotate(-15 200 150)"/>
  <ellipse cx="900" cy="600" rx="350" ry="100" fill="url(#wisp-fade)" transform="rotate(20 900 600)"/>
  <ellipse cx="600" cy="400" rx="200" ry="60" fill="url(#wisp-fade)" transform="rotate(5 600 400)"/>

  <!-- Large stars -->
  <use href="#star-lg" transform="translate(95, 105)" fill="currentColor" filter="url(#star-glow)" opacity="0.9"/>
  <use href="#star-lg" transform="translate(1080, 650)" fill="currentColor" filter="url(#star-glow)" opacity="0.8"/>
  <use href="#star-md" transform="translate(480, 360)" fill="currentColor" filter="url(#star-glow)" opacity="0.7"/>

  <!-- Medium stars -->
  <use href="#star-md" transform="translate(180, 200)" fill="currentColor" opacity="0.8"/>
  <use href="#star-md" transform="translate(850, 550)" fill="currentColor" opacity="0.7"/>
  <use href="#star-sm" transform="translate(320, 130)" fill="currentColor" opacity="0.9"/>
  <use href="#star-sm" transform="translate(750, 620)" fill="currentColor" opacity="0.8"/>
  <use href="#star-sm" transform="translate(150, 300)" fill="currentColor" opacity="0.6"/>
  <use href="#star-sm" transform="translate(1000, 500)" fill="currentColor" opacity="0.7"/>

  <!-- Fine dust -->
  <circle cx="60" cy="80" r="1" fill="currentColor" opacity="0.5"/>
  <circle cx="240" cy="45" r="1.5" fill="currentColor" opacity="0.4"/>
  <circle cx="420" cy="200" r="1" fill="currentColor" opacity="0.6"/>
  <circle cx="580" cy="90" r="1" fill="currentColor" opacity="0.3"/>
  <circle cx="720" cy="160" r="1.5" fill="currentColor" opacity="0.5"/>
  <circle cx="880" cy="80" r="1" fill="currentColor" opacity="0.4"/>
  <circle cx="1050" cy="200" r="1" fill="currentColor" opacity="0.6"/>
  <circle cx="140" cy="420" r="1" fill="currentColor" opacity="0.4"/>
  <circle cx="340" cy="480" r="1.5" fill="currentColor" opacity="0.5"/>
  <circle cx="520" cy="520" r="1" fill="currentColor" opacity="0.3"/>
  <circle cx="680" cy="440" r="1" fill="currentColor" opacity="0.6"/>
  <circle cx="820" cy="380" r="1.5" fill="currentColor" opacity="0.4"/>
  <circle cx="960" cy="460" r="1" fill="currentColor" opacity="0.5"/>
  <circle cx="1100" cy="380" r="1" fill="currentColor" opacity="0.3"/>
  <circle cx="80" cy="640" r="1" fill="currentColor" opacity="0.5"/>
  <circle cx="260" cy="700" r="1.5" fill="currentColor" opacity="0.4"/>
  <circle cx="440" cy="660" r="1" fill="currentColor" opacity="0.6"/>
  <circle cx="640" cy="740" r="1" fill="currentColor" opacity="0.3"/>
  <circle cx="800" cy="700" r="1.5" fill="currentColor" opacity="0.5"/>
  <circle cx="1000" cy="720" r="1" fill="currentColor" opacity="0.4"/>
  <circle cx="1150" cy="640" r="1" fill="currentColor" opacity="0.6"/>
</svg>
