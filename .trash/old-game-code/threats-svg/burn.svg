<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60">
  <!-- Burn: depleting resource container with visible drain line -->
  <g opacity="0.8">
    <!-- Tank outline -->
    <rect x="16" y="10" width="28" height="40" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <!-- Fill level (partially drained) -->
    <rect x="18" y="30" width="24" height="18" rx="2" fill="currentColor" opacity="0.3"/>
    <!-- Drain line -->
    <line x1="30" y1="50" x2="30" y2="58" stroke="currentColor" stroke-width="1" opacity="0.6"/>
    <!-- Drip -->
    <circle cx="30" cy="58" r="1.5" fill="currentColor" opacity="0.5"/>
    <!-- Level markers -->
    <line x1="12" y1="20" x2="16" y2="20" stroke="currentColor" stroke-width="0.5" opacity="0.4"/>
    <line x1="12" y1="30" x2="16" y2="30" stroke="currentColor" stroke-width="0.5" opacity="0.4"/>
    <line x1="12" y1="40" x2="16" y2="40" stroke="currentColor" stroke-width="0.5" opacity="0.4"/>
  </g>
</svg>
