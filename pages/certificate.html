  <div class="ct-page" id="ct-root">
    <div class="ct-empty">Loading…</div>
  </div>

  <script>
    const root = document.getElementById('ct-root');
    const esc = (s) => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const fmt = (d) => { if (!d) return ''; try { return new Date(d).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}); } catch(e){ return d; } };

    (async function () {
      try { if (window.Clerk && !window.Clerk.loaded) await window.Clerk.load(); } catch (e) {}

      let data;
      try { const r = await fetch('/api/member/graduation'); data = await r.json(); }
      catch (e) { root.innerHTML = '<div class="ct-empty">Could not load this right now. Please refresh.</div>'; return; }

      const rec = data && data.record;
      if (!rec || !rec.certificate_issued) {
        root.innerHTML = '<div class="ct-empty">You have not graduated yet. When Earl decides the time is right, your exit interview unlocks here.<br><br><a href="/progress">Back to your progress →</a></div>';
        return;
      }

      const changes = Array.isArray(rec.comparison && rec.comparison.changes) ? rec.comparison.changes : [];
      let html = '<div class="ct-cert">';
      html += '<div class="ct-kicker">The Bridge · Certificate of Completion</div>';
      html += '<div class="ct-name">' + esc(data.memberName || 'A Captain') + '</div>';
      if (data.businessName) html += '<div class="ct-biz">' + esc(data.businessName) + '</div>';
      html += '<div class="ct-dates">Started ' + esc(fmt(rec.started_on)) + ' &nbsp;·&nbsp; Graduated ' + esc(fmt(rec.graduated_on)) + '</div>';
      html += '<div class="ct-lead">Here is what changed, in your own words, from where you started to where you are now.</div>';
      changes.forEach(c => { html += '<div class="ct-change"><span class="mark">→</span><span>' + esc(c) + '</span></div>'; });
      if (rec.free_access_until) {
        html += '<div class="ct-free">Your access continues at no charge through ' + esc(fmt(rec.free_access_until)) + '. Earl remains here whenever you want it.</div>';
      }
      html += '</div>';
      html += '<div class="ct-actions"><button class="ct-btn" onclick="window.print()">Download / Print</button>' +
        '<a class="ct-btn ct-btn-ghost" href="/dashboard">Back to Earl</a></div>';
      root.innerHTML = html;
    })();
  </script>
