<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
                 viewport-fit=cover, user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <title>The Bridge — Simulator</title>
  <link rel="stylesheet" href="/css/global.css"/>
  <link rel="stylesheet" href="/css/game.css"/>
</head>
<body>

  <!-- Star field — always behind everything -->
  <canvas id="starfield"></canvas>

  <!-- Game container — two zones, nothing else -->
  <div id="game-container">

    <!-- Zone 1: Viewscreen — 55dvh -->
    <div id="viewscreen">
      <div id="mission-objective"><!-- populated by game.js --></div>
      <div id="threat-area"><!-- threats render here --></div>
      <div id="ship-container"><!-- ship SVG renders here --></div>
      <div id="stats-bar">
        <div class="stat" id="stat-momentum">
          <span class="stat-label">MOMENTUM</span>
          <div class="stat-bar"><div class="stat-fill" id="fill-momentum"></div></div>
          <span class="stat-value" id="val-momentum">--</span>
        </div>
        <div class="stat" id="stat-resilience">
          <span class="stat-label">RESILIENCE</span>
          <div class="stat-bar"><div class="stat-fill" id="fill-resilience"></div></div>
          <span class="stat-value" id="val-resilience">--</span>
        </div>
        <div class="stat" id="stat-clarity">
          <span class="stat-label">CLARITY</span>
          <div class="stat-bar"><div class="stat-fill" id="fill-clarity"></div></div>
          <span class="stat-value" id="val-clarity">--</span>
        </div>
      </div>
      <div id="diagnosis-line"><!-- populated after each resolution --></div>

      <!-- Exit button -->
      <button id="btn-exit" aria-label="Exit game">✕</button>

      <!-- Turn counter -->
      <div id="turn-counter">TURN <span id="turn-number">0</span></div>

      <!-- Mission info -->
      <div id="mission-info">
        MISSION <span id="mission-number">1</span>
      </div>
    </div>

    <!-- Zone 2: Power Panel — 45dvh -->
    <div id="power-panel">
      <div id="budget-bar">
        <span class="budget-label">POWER</span>
        <div id="budget-track">
          <div id="budget-fill"></div>
        </div>
        <span id="budget-value" class="readout">20</span>
      </div>
      <div id="adjustment-dots">
        <span class="adj-dot" id="dot-1"></span>
        <span class="adj-dot" id="dot-2"></span>
        <span class="adj-dot" id="dot-3"></span>
      </div>
      <div id="systems-grid">
        <!-- System cells injected by levers.js -->
      </div>
    </div>

  </div>

  <!-- GO Button — fixed, always visible -->
  <button id="btn-go">GO</button>

  <!-- Tutorial overlay -->
  <div id="tutorial-overlay" class="hidden">
    <div id="tutorial-card">
      <p id="tutorial-text"></p>
      <div id="tutorial-dots"></div>
      <button id="tutorial-next">NEXT →</button>
    </div>
  </div>

  <!-- Exit confirmation modal -->
  <div id="exit-modal" class="hidden">
    <div class="modal-panel">
      <p class="modal-title">LEAVE THE BRIDGE?</p>
      <button id="exit-save">Save with email and leave</button>
      <button id="exit-leave">Leave without saving</button>
      <button id="exit-stay">Keep flying</button>
    </div>
  </div>

  <!-- Unlock ceremony overlay -->
  <div id="unlock-overlay" class="hidden">
    <div id="unlock-card">
      <div id="unlock-icon"></div>
      <p id="unlock-title"></p>
      <p id="unlock-game"></p>
      <p id="unlock-framework"></p>
      <button id="unlock-dismiss">UNDERSTOOD →</button>
    </div>
  </div>

  <!-- Death screen -->
  <div id="death-screen" class="hidden">
    <div class="modal-panel">
      <p id="death-ship-name"></p>
      <p id="death-cause"></p>
      <div id="death-debrief"><!-- populated by API call --></div>
      <button id="death-save">CONTINUE FLYING FREE</button>
      <button id="death-member">
        A REAL THREAT IS ON THE HORIZON.<br/>
        Become a member and learn to captain your ship.
      </button>
    </div>
  </div>

  <!-- Case study tile -->
  <div id="case-study-tile" class="hidden">
    <p id="case-study-text"></p>
  </div>

  <!-- Reality flash -->
  <div id="reality-flash" class="hidden">
    <p id="reality-text"></p>
  </div>

  <!-- Screen pulse overlay — for dopamine flash -->
  <div id="screen-pulse"></div>

  <script type="module">
    import { renderStarfield } from '/js/starfield.js';
    renderStarfield('starfield');
  </script>
</body>
</html>
