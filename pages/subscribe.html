        <div class="subscribe-tier">EARL MEMBERSHIP</div>

        <div class="subscribe-annual">6 months of full access</div>

  <script>var _isProd = location.hostname === 'captainsbridge.io' || location.hostname === 'www.captainsbridge.io'; window.__clerk_publishable_key = _isProd ? 'pk_live_Y2xlcmsuY2FwdGFpbnNicmlkZ2UuaW8k' : 'pk_test_b2JsaWdpbmctcHl0aG9uLTUuY2xlcmsuYWNjb3VudHMuZGV2JA';</script>
  <script src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js"></script>
  <script>
    let clerk = null;

    async function init() {
      try {
        clerk = window.Clerk;
        if (clerk && !clerk.loaded) await clerk.load();

        if (!clerk || !clerk.user) {
          window.location.href = '/login?return=/subscribe';
          return;
        }

        // If already a member, skip to dashboard
        try {
          const tierResp = await fetch('/api/auth/me');
          if (tierResp.ok) {
            const tierData = await tierResp.json();
            if (tierData.membershipTier === 'captain' || tierData.membershipTier === 'ensign') {
              window.location.href = '/dashboard';
              return;
            }
          }
        } catch(e) {}

        document.getElementById('btn-earl').addEventListener('click', startCheckout);
      } catch (e) {
        document.getElementById('subscribe-status').textContent = 'Unable to verify your account. Please try again.';
      }
    }

    async function startCheckout() {
      const btn = document.getElementById('btn-earl');
      const status = document.getElementById('subscribe-status');

      btn.disabled = true;
      btn.textContent = 'Redirecting to checkout...';
      status.textContent = '';

      try {
        const res = await fetch('/api/payments/create-checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: clerk.user.primaryEmailAddress?.emailAddress,
            clerkId: clerk.user.id
          })
        });

        const data = await res.json();

        if (data.url) {
          window.location.href = data.url;
        } else {
          status.textContent = data.error || 'Something went wrong. Please try again.';
          btn.disabled = false;
          btn.textContent = 'Get Access';
        }
      } catch (e) {
        status.textContent = 'Connection failed. Please try again.';
        btn.disabled = false;
        btn.textContent = 'Get Access';
      }
    }

    init();
  </script>
