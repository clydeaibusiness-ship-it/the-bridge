  <div class="pf-page">
    <div class="pf-heading">Your Account</div>
    <div class="pf-title">Profile</div>

    <div class="pf-block-title">Change an Interview Answer</div>
    <div id="pf-body"><div class="pf-note">Loading…</div></div>
  </div>

  <script>
    const body = document.getElementById('pf-body');
    const esc = (s) => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

    async function api(path, method, b) {
      const opts = { method, headers: { 'Content-Type': 'application/json' } };
      if (b) opts.body = JSON.stringify(b);
      const r = await fetch(path, opts);
      let json = null; try { json = await r.json(); } catch (e) {}
      return { ok: r.ok, status: r.status, json };
    }

    let answers = [];

    function render(remaining, contactEmail) {
      if (remaining <= 0) {
        body.innerHTML = '<div class="pf-remaining">You have used all of your interview changes.</div>' +
          '<div class="pf-note">If you need to make a change that reflects a genuine shift in your situation, reach out to <a href="mailto:' + esc(contactEmail) + '">' + esc(contactEmail) + '</a>.</div>';
        return;
      }
      let opts = answers.map((a, i) => '<option value="' + i + '">' + esc(a.label) + '</option>').join('');
      body.innerHTML =
        '<div class="pf-remaining">You have <b>' + remaining + '</b> change' + (remaining === 1 ? '' : 's') + ' remaining.</div>' +
        '<label class="pf-label">Which answer do you want to change?</label>' +
        '<select class="pf-select" id="pf-select">' + opts + '</select>' +
        '<label class="pf-label">Your answer</label>' +
        '<textarea class="pf-text" id="pf-text"></textarea>' +
        '<button class="pf-btn" id="pf-save">Save change</button>' +
        '<div class="pf-status" id="pf-status"></div>' +
        '<div class="pf-note">Changes are limited. Each save uses one of your remaining changes.</div>';

      const sel = document.getElementById('pf-select');
      const txt = document.getElementById('pf-text');
      const fill = () => { txt.value = answers[sel.value] ? answers[sel.value].answer : ''; };
      sel.addEventListener('change', fill); fill();

      document.getElementById('pf-save').addEventListener('click', async () => {
        const a = answers[sel.value];
        const val = txt.value.trim();
        const status = document.getElementById('pf-status');
        if (!a || !val) { status.textContent = ''; return; }
        const btn = document.getElementById('pf-save');
        btn.disabled = true; status.style.color = '#6a8a5a'; status.textContent = 'Saving…';
        const r = await api('/api/member/intake-changes', 'POST', { field: a.field, answer: val });
        if (r.ok && r.json) {
          a.answer = val;
          status.textContent = 'Saved.';
          // Reload to reflect the new remaining count (and lock at zero).
          setTimeout(load, 700);
        } else if (r.status === 403) {
          load();
        } else {
          btn.disabled = false; status.style.color = '#a35'; status.textContent = 'Could not save. Try again.';
        }
      });
    }

    async function load() {
      const r = await api('/api/member/intake-changes', 'GET');
      if (!r.ok || !r.json || r.json.authenticated === false) {
        body.innerHTML = '<div class="pf-note">Please <a href="/login">sign in</a>.</div>';
        return;
      }
      answers = r.json.answers || [];
      if (!answers.length) {
        body.innerHTML = '<div class="pf-note">You have not completed the interview yet. <a href="/intake">Start it here →</a></div>';
        return;
      }
      render(r.json.remaining || 0, r.json.contactEmail || 'ClydeAIbusiness@gmail.com');
    }

    (async function () {
      try { if (window.Clerk && !window.Clerk.loaded) await window.Clerk.load(); }
      catch (e) {}
      load();
    })();
  </script>
