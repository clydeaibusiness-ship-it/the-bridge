<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Bridge — Grant Radar Intake</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/nav.css">
  <style>
    html, body { overflow: visible !important; height: auto !important; background: #f5f0e8 !important; color: #0a0a0f !important; }
    .gri-page { max-width: 560px; margin: 0 auto; padding: 48px 20px 80px; }
    .gri-progress { font-family: var(--font-data); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #7a7570; margin-bottom: 24px; }
    .gri-question { display: none; flex-direction: column; gap: 12px; }
    .gri-question.active { display: flex; }
    .gri-question label.gri-label { font-family: var(--font-ui); font-size: var(--text-sm); color: #0a0a0f; font-weight: 400; line-height: 1.5; }
    .gri-question input[type="text"],
    .gri-question input[type="number"],
    .gri-question textarea,
    .gri-question select {
      font-family: var(--font-ui); font-size: var(--text-base); color: #0a0a0f;
      background: #ece7dc; border: 1px solid #c8c0b0; border-radius: 6px;
      padding: 12px 14px; min-height: 48px; outline: none; transition: border-color 0.2s;
      -webkit-appearance: none; width: 100%; box-sizing: border-box;
    }
    .gri-question input:focus, .gri-question textarea:focus, .gri-question select:focus { border-color: #3a3530; }
    .gri-question textarea { resize: vertical; min-height: 80px; }
    .gri-hint { font-family: var(--font-ui); font-size: 12px; color: #7a7570; line-height: 1.5; }
    .gri-hint a { color: #3a3530; }
    .gri-radios, .gri-checkboxes { display: flex; flex-direction: column; gap: 8px; }
    .gri-radios label, .gri-checkboxes label {
      font-family: var(--font-ui); font-size: var(--text-sm); color: #0a0a0f;
      display: flex; align-items: center; gap: 8px; cursor: pointer;
    }
    .gri-nav { display: flex; gap: 12px; margin-top: 24px; }
    .gri-btn-next, .gri-btn-submit {
      font-family: var(--font-ui); font-size: var(--text-base); font-weight: 500;
      color: #f0ebe0; background: #0a0a0f; border: none; border-radius: 6px;
      padding: 14px 32px; min-height: 48px; cursor: pointer; transition: background 0.2s;
    }
    .gri-btn-next:active, .gri-btn-submit:active { background: #1e1e2a; }
    .gri-btn-back {
      font-family: var(--font-ui); font-size: var(--text-sm); color: #7a7570;
      background: none; border: 1px solid #c8c0b0; border-radius: 6px;
      padding: 14px 24px; cursor: pointer;
    }
    .gri-revenue-wrap { display: flex; align-items: center; gap: 4px; }
    .gri-revenue-wrap span { font-size: 1rem; font-weight: 500; color: #0a0a0f; }
    .gri-prefill-notice {
      font-family: var(--font-ui); font-size: 12px; color: #5a8a6a;
      background: #e8f0e8; border-radius: 4px; padding: 6px 10px; margin-top: -4px;
    }
  </style>
  <script>window.__clerk_publishable_key = 'pk_live_Y2xlcmsuY2FwdGFpbnNicmlkZ2UuaW8k';</script>
  <script src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js"></script>
</head>
<body>
  <nav class="site-nav">
    <a href="/" class="site-nav-brand">The Bridge</a>
    <div class="site-nav-links">
      <a href="/simulator">Simulator</a>
      <span class="site-nav-sep">|</span>
      <a href="/navigation-chart">Navigator</a>
      <span class="site-nav-sep">|</span>
      <a href="/grant-radar" class="nav-active">Grant Radar</a>
      <span class="site-nav-sep">|</span>
      <a href="/dashboard">Dashboard</a>
      <span class="site-nav-sep">|</span>
      <a href="/api/auth/logout">Sign Out</a>
    </div>
    <button class="site-nav-hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
    <div class="site-nav-mobile" id="mobile-menu"><button class="site-nav-mobile-close" aria-label="Close">✕</button>
      <a href="/simulator">Simulator</a>
      <a href="/navigation-chart">Navigator</a>
      <a href="/grant-radar" class="nav-active">Grant Radar</a>
      <a href="/dashboard">Dashboard</a>
      <a href="/api/auth/logout">Sign Out</a>
    </div>
  </nav>

  <div class="gri-page">
    <div class="gri-progress" id="gri-progress">Question 1 of approximately 20</div>

    <!-- All questions are rendered as divs, shown one at a time -->
    <div id="gri-questions"></div>

    <div class="gri-nav">
      <button class="gri-btn-back" id="gri-back" style="display:none;">← Back</button>
      <button class="gri-btn-next" id="gri-next">Next →</button>
      <button class="gri-btn-submit" id="gri-submit" style="display:none;">Find my grants →</button>
    </div>
  </div>

  <script src="/js/nav.js"></script>
  <script src="/js/grant-radar-intake.js"></script>
</body>
</html>
