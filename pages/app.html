    /* Side panel content */

<body>
  <div class="shell">
    <div class="tb">
      <span class="tb-title" id="tb-title">EARL</span>
      <button class="tb-btn" id="history-btn" aria-label="History" style="font-size:1rem;">&#8635;</button>
    </div>

    <div class="panels">
      <div class="track" id="track">

        <!-- LEFT: Navigation Chart -->
        <section class="panel">
          <div class="panel-scroll" id="chart-panel">
            <div class="sp-title">Navigation Chart</div>
            <div id="chart-body"><p class="sp-empty">Loading your chart&#8230;</p></div>
            <div class="settings">
              <button class="settings-row" data-change-answer>Change an interview answer</button>
              <a class="settings-row" href="/subscribe">Manage subscription</a>
              <a class="settings-row danger" href="/api/auth/logout">Sign out</a>
            </div>
            <div id="app-version" style="font-family:var(--font-data);font-size:0.6rem;color:#b0a898;letter-spacing:0.08em;text-align:center;padding:16px 0 4px;"></div>
          </div>
        </section>

        <!-- CENTER: Earl -->
        <section class="panel">
          <div id="interview-banner" style="display:none;"></div>
          <div class="msgs" id="msgs"></div>
          <div class="prompts" id="prompts">
            <button class="pill" data-p="What are you, exactly — and why would I talk to you instead of just figuring things out myself?">What are you, exactly?</button>
            <button class="pill" data-p="How does this work? What should I expect from our conversations?">How does this work?</button>
            <button class="pill" data-p="What do you know about my business so far, and what do you still need to know?">What do you know about me so far?</button>
            <button class="pill" data-p="What's the most important thing you'd want to know about me and my business right now?">What do you want to know first?</button>
          </div>
          <div class="composer">
            <div class="composer-row">
              <input id="composer-input" type="text" placeholder="Ask Earl&#8230;" autocomplete="off">
              <button class="send" id="composer-send" aria-label="Send">&#8593;</button>
            </div>
          </div>
        </section>

        <!-- RIGHT: Progress -->
        <section class="panel">
          <div class="panel-scroll" id="progress-panel">
            <div class="sp-title">Your Progress</div>
            <div id="progress-body"><p class="sp-empty">Loading your progress&#8230;</p></div>
          </div>
        </section>

      </div>
    </div>

    <div class="slider">
      <div class="slider-inner" id="slider">
        <div class="slider-pill" id="slider-pill"></div>
        <button data-i="0">Chart</button>
        <button data-i="1" class="active">Earl</button>
        <button data-i="2">Progress</button>
      </div>
    </div>


    <div class="modal-scrim" id="ca-scrim">
      <div class="modal">
        <h3>Change an interview answer</h3>
        <div id="ca-body"></div>
      </div>
    </div>
  </div>

  <script>
    const TITLES = ['NAVIGATION CHART', 'EARL', 'YOUR PROGRESS'];
    const track = document.getElementById('track');
    const tbTitle = document.getElementById('tb-title');
    const sliderBtns = Array.from(document.querySelectorAll('#slider button'));
    const pill = document.getElementById('slider-pill');
    let current = 1;

    const PANEL_PATHS = ['/app/chart', '/app/earl', '/app/progress'];
    function goTo(i) {
      current = Math.max(0, Math.min(2, i));
      track.style.transform = `translateX(-${current * 33.3333}%)`;
      pill.style.transform = `translateX(${current * 100}%)`;
      tbTitle.textContent = TITLES[current];
      sliderBtns.forEach(b => b.classList.toggle('active', Number(b.dataset.i) === current));
      if (typeof gtag !== 'undefined') {
        gtag('event', 'page_view', { page_path: PANEL_PATHS[current], page_title: TITLES[current] });
      }
    }
    sliderBtns.forEach(b => b.addEventListener('click', () => goTo(Number(b.dataset.i))));
    goTo(1); // start on Earl immediately

    // Touch swipe between panels (ignored while swiping inside the message list horizontally)
    let sx = 0, sy = 0, swiping = false;
    const panels = document.querySelector('.panels');
    panels.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; swiping = true; }, { passive: true });
    panels.addEventListener('touchend', e => {
      if (!swiping) return; swiping = false;
      const dx = e.changedTouches[0].clientX - sx;
      const dy = e.changedTouches[0].clientY - sy;
      if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5) goTo(current + (dx < 0 ? 1 : -1));
    }, { passive: true });


    // Change-an-answer modal (replaces the old /profile page)
    const caScrim = document.getElementById('ca-scrim');
    const caBody = document.getElementById('ca-body');
    function closeCA() { caScrim.classList.remove('open'); }
    caScrim.addEventListener('click', e => { if (e.target === caScrim) closeCA(); });

    async function openChangeAnswer() {
      caBody.innerHTML = '<p class="modal-note">Loading&#8230;</p>';
      caScrim.classList.add('open');
      const { ok, data } = await api('/api/member/intake-changes');
      if (!ok || !data || data.authenticated === false) { caBody.innerHTML = '<p class="modal-note">Please sign in.</p>'; return; }
      const answers = data.answers || [];
      const remaining = data.remaining || 0;
      const email = data.contactEmail || 'ClydeAIbusiness@gmail.com';
      if (!answers.length) {
        caBody.innerHTML = '<p class="modal-note">You have not completed the interview yet.</p><div class="modal-actions"><button class="modal-btn ghost" id="ca-x">Close</button></div>';
        document.getElementById('ca-x').onclick = closeCA; return;
      }
      if (remaining <= 0) {
        caBody.innerHTML = '<p class="modal-note">You have used all of your interview changes. For another, email <a href="mailto:' + esc(email) + '">' + esc(email) + '</a>.</p><div class="modal-actions"><button class="modal-btn ghost" id="ca-x">Close</button></div>';
        document.getElementById('ca-x').onclick = closeCA; return;
      }
      const opts = answers.map((a, i) => '<option value="' + i + '">' + esc(a.label) + '</option>').join('');
      caBody.innerHTML =
        '<p class="modal-note" style="margin-bottom:14px;">You have <b>' + remaining + '</b> change' + (remaining === 1 ? '' : 's') + ' left.</p>' +
        '<label>Which answer do you want to change?</label><select id="ca-sel">' + opts + '</select>' +
        '<label>Your answer</label><textarea id="ca-text"></textarea>' +
        '<div class="modal-actions"><button class="modal-btn ghost" id="ca-x">Cancel</button><button class="modal-btn primary" id="ca-save">Save change</button></div>';
      const sel = document.getElementById('ca-sel'), txt = document.getElementById('ca-text');
      const fill = () => { txt.value = answers[sel.value] ? answers[sel.value].answer : ''; };
      sel.onchange = fill; fill();
      document.getElementById('ca-x').onclick = closeCA;
      document.getElementById('ca-save').onclick = async () => {
        const a = answers[sel.value], val = txt.value.trim();
        if (!a || !val) return;
        const btn = document.getElementById('ca-save'); btn.disabled = true; btn.textContent = 'Saving…';
        await api('/api/member/intake-changes', 'POST', { field: a.field, answer: val });
        closeCA();
        loadChart();
      };
    }
    document.querySelectorAll('[data-change-answer]').forEach(el =>
      el.addEventListener('click', e => { e.preventDefault(); openChangeAnswer(); }));

    // ---- Helpers ----
    const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const fmtDate = (iso) => { if (!iso) return ''; try { return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); } catch (e) { return ''; } };
    async function api(path, method, body) {
      const opts = { method: method || 'GET', headers: { 'Content-Type': 'application/json' } };
      if (body) opts.body = JSON.stringify(body);
      const r = await fetch(path, opts);
      let data = null; try { data = await r.json(); } catch (e) {}
      return { ok: r.ok, status: r.status, data };
    }

    // ---- Earl ----
    const msgs = document.getElementById('msgs');
    const prompts = document.getElementById('prompts');
    const input = document.getElementById('composer-input');
    const sendBtn = document.getElementById('composer-send');

    function addMsg(text, type) {
      const d = document.createElement('div');
      d.className = 'm m-' + type;
      d.textContent = text;
      msgs.appendChild(d);
      msgs.scrollTop = msgs.scrollHeight;
    }

    async function loadHistory() {
      const { ok, data } = await api('/api/member/commander/history');
      if (ok && data) {
        if (data.summary) addMsg('Previous session summary: ' + data.summary, 'system');
        if (data.messages && data.messages.length) {
          data.messages.forEach(m => {
            if (m.role === 'system_note') {
              const div = document.createElement('div');
              div.className = 'm-compress';
              div.innerHTML = '<span>Earlier context summarized</span>';
              msgs.appendChild(div);
            } else {
              addMsg(m.content, m.role === 'user' ? 'user' : 'commander');
            }
          });
          prompts.style.display = 'none';
        }
        // Quiet pre-conversation note (cleared on the next send).
        if (data.preConversation) {
          const note = document.createElement('div');
          note.className = 'm m-system pre-note';
          note.textContent = 'Last time, this was left open: ' + data.preConversation;
          msgs.appendChild(note);
          msgs.scrollTop = msgs.scrollHeight;
        }
      }
    }

    async function send() {
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      prompts.style.display = 'none';
      const pre = msgs.querySelector('.pre-note'); if (pre) pre.remove();
      addMsg(text, 'user');
      sendBtn.disabled = true;

      // Capture current panel so DOM changes after response don't confuse mobile layout
      const panelAtSend = current;

      const loading = document.createElement('div');
      loading.className = 'm m-commander'; loading.textContent = 'Thinking…'; loading.style.opacity = '0.5';
      msgs.appendChild(loading); msgs.scrollTop = msgs.scrollHeight;

      try { if (window.Clerk && window.Clerk.session) await window.Clerk.session.getToken(); } catch (e) {}

      try {
        const { ok, data } = await api('/api/member/commander/message', 'POST', { message: text });
        loading.remove();
        if (ok && data && data.response) {
          addMsg(data.response, 'commander');
          loadProgress();
          // Re-assert whichever panel the user is on — DOM changes can desync
          // the mobile layout if the user switched panels while Earl was responding
          if (current !== panelAtSend) goTo(current);
        } else {
          addMsg('Earl hit a snag on that one. Give it another try in a moment.', 'system');
          input.value = text;
        }
      } catch (err) {
        loading.remove();
        addMsg(navigator.onLine ? 'Could not reach Earl just now. Check your connection and try again.' : 'You appear to be offline. Your message was not sent — try again once you are back.', 'system');
        input.value = text;
      }
      sendBtn.disabled = false;
      input.focus();
    }
    // Re-assert panel position when mobile keyboard opens/closes (viewport resize)
    window.visualViewport && window.visualViewport.addEventListener('resize', () => goTo(current));

    sendBtn.addEventListener('click', send);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
    prompts.querySelectorAll('.pill').forEach(p => p.addEventListener('click', () => { input.value = p.dataset.p; send(); }));
    document.getElementById('history-btn').addEventListener('click', () => {
      sessionStorage.setItem('earlPanel', current);
      window.location.reload();
    });

    // ---- Interview warning banners ----
    function showBanner(stages) {
      const el = document.getElementById('interview-banner');
      if (!el) return;
      if (!stages || stages.stage_3) { el.style.display = 'none'; return; }
      const isRed = !stages.stage_2;
      el.className = 'iv-banner ' + (isRed ? 'red' : 'yellow');
      el.style.display = 'flex';
      el.innerHTML = isRed
        ? `<span>Earl is missing context that matters. <a href="/intake">Complete Stage 2</a> to get more from every conversation.</span><button class="iv-banner-dismiss" aria-label="Dismiss">&times;</button>`
        : `<span>Earl still needs Stage 3 to see the full picture. <a href="/intake">Complete it now</a> for better conversations.</span><button class="iv-banner-dismiss" aria-label="Dismiss">&times;</button>`;
      el.querySelector('.iv-banner-dismiss').addEventListener('click', () => { el.style.display = 'none'; });
    }

    // ---- Progress ----
    async function loadProgress() {
      const { data } = await api('/api/member/progress');
      const body = document.getElementById('progress-body');
      if (!data || data.authenticated === false) return;

      const st = data.stages || {};

      // Gate: need Stage 2 for anything meaningful to show
      if (!st.stage_2) {
        const link = st.stage_1 ? '<a class="pg-continue" href="/intake">Continue to Stage 2 &#8594;</a>' : '';
        body.innerHTML = `<p class="sp-empty">Your progress view builds after you complete Stage 2 of the interview. That is where your goals take shape.</p>${link}`;
        return;
      }

      let html = '';

      // Graduation block
      const g = data.graduation || {};
      if (g.graduated) {
        html += '<div class="pg-grad"><p>You have completed your goals. <a href="/certificate">Download your certificate &#8594;</a></p></div>';
      } else if (g.offered) {
        html += '<div class="pg-grad"><p>You may be ready to graduate. When you are, begin your exit interview — the same questions you started with, answered fresh.</p><button class="pg-grad-btn" id="pg-grad-start">Begin exit interview</button></div>';
      }

      // Continue interview prompt
      if (!st.stage_3) {
        html += `<a class="pg-continue" href="/intake">Continue to Stage 3 &#8594;</a>`;
      }

      // Build cascading timeline
      const benches = data.benchmarks || [];
      const allSteps = [...(data.actionSteps?.active || []), ...(data.actionSteps?.completed || []), ...(data.actionSteps?.did_not_happen || [])];

      // Separate linked and unlinked steps
      const linkedSteps = {};
      const generalSteps = [];
      allSteps.forEach(s => {
        if (s.benchmark_id) {
          (linkedSteps[s.benchmark_id] = linkedSteps[s.benchmark_id] || []).push(s);
        } else {
          generalSteps.push(s);
        }
      });

      // Goals timeline — each goal is a node, its action steps nest underneath it
      if (benches.length) {
        html += '<div class="tl">';
        benches.forEach(b => {
          const achieved = b.current_rating != null && b.current_rating >= 7;
          const nodeClass = achieved ? 'done' : 'active';
          const steps = linkedSteps[b.id] || [];
          html += `<div class="tl-item">
            <div class="tl-node ${nodeClass}"></div>
            <div class="tl-label">${esc(b.statement)}</div>
            <span class="tl-tag ${achieved ? 'done' : 'active'}">${achieved ? 'achieved' : 'in progress'}</span>`;
          if (steps.length) {
            html += '<div class="tl-steps">';
            steps.forEach(s => {
              const done = s.status !== 'active';
              html += `<div class="tl-step${done ? ' done' : ''}"><div class="tl-step-dot"></div><span>${esc(s.step_text)}</span></div>`;
            });
            html += '</div>';
          }
          html += `<button class="tl-add-btn" data-bid="${esc(b.id)}">+ Add action step</button>
            <div class="tl-add-form" id="tl-form-${esc(b.id)}">
              <div class="tl-add-hint">Make it SMART: Specific, Measurable, Achievable, Relevant, and Time-bound.<br>e.g. "Follow up with 3 past clients by Friday to ask for a referral."</div>
              <textarea class="tl-add-input" placeholder="Describe your action step..."></textarea>
              <div class="tl-add-actions">
                <button class="tl-add-save" data-bid="${esc(b.id)}">Save</button>
                <button class="tl-add-cancel" data-bid="${esc(b.id)}">Cancel</button>
              </div>
            </div>`;
          html += '</div>';
        });

        // Graduation node at bottom
        html += `<div class="tl-item">
          <div class="tl-node ${g.graduated ? 'grad' : ''}"></div>
          <div class="tl-label muted">${g.graduated ? 'Graduated' : 'Graduation'}</div>
          ${g.graduated ? '<span class="tl-tag done">complete</span>' : '<span class="tl-tag upcoming">ahead</span>'}
        </div>`;
        html += '</div>';
      }

      // Action steps not yet tied to a specific goal — shown below the timeline
      if (generalSteps.length) {
        html += '<div class="tl-general"><div class="tl-general-title">Other action steps</div>';
        html += '<div class="tl-steps" style="margin-left:0;">';
        generalSteps.forEach(s => {
          const done = s.status !== 'active';
          html += `<div class="tl-step${done ? ' done' : ''}"><div class="tl-step-dot"></div><span>${esc(s.step_text)}</span></div>`;
        });
        html += '</div></div>';
      }

      // Session reflections
      const refl = data.reflections || [];
      if (refl.length) {
        html += '<div class="sp-block-title" style="margin-top:24px;">Session reflections</div>';
        refl.slice(0, 8).forEach(r => html += `<div class="pg-refl">${esc(r.summary)}</div>`);
      }

      // Periodic report
      if (data.periodicReport && data.periodicReport.letter) {
        html += '<div class="sp-block-title">A note from Earl</div>' +
          `<div class="pg-letter">${esc(data.periodicReport.letter)}<div class="pg-letter-date">${fmtDate(data.periodicReport.created_at)}</div></div>`;
      }

      body.innerHTML = html;

      // Add step button delegation
      body.addEventListener('click', async (e) => {
        const addBtn = e.target.closest('.tl-add-btn');
        if (addBtn) {
          const bid = addBtn.dataset.bid;
          document.getElementById('tl-form-' + bid).classList.add('open');
          addBtn.style.display = 'none';
          return;
        }
        const cancelBtn = e.target.closest('.tl-add-cancel');
        if (cancelBtn) {
          const bid = cancelBtn.dataset.bid;
          const form = document.getElementById('tl-form-' + bid);
          form.classList.remove('open');
          form.querySelector('.tl-add-input').value = '';
          body.querySelector(`.tl-add-btn[data-bid="${bid}"]`).style.display = '';
          return;
        }
        const saveBtn = e.target.closest('.tl-add-save');
        if (saveBtn) {
          const bid = saveBtn.dataset.bid;
          const form = document.getElementById('tl-form-' + bid);
          const text = form.querySelector('.tl-add-input').value.trim();
          if (!text) { form.querySelector('.tl-add-input').focus(); return; }
          saveBtn.disabled = true; saveBtn.textContent = 'Saving...';
          const { ok, data } = await api('/api/member/action-steps', 'POST', { step_text: text, benchmark_id: bid });
          if (ok && data && data.step) {
            let stepsDiv = form.closest('.tl-item').querySelector('.tl-steps');
            if (!stepsDiv) {
              stepsDiv = document.createElement('div');
              stepsDiv.className = 'tl-steps';
              form.closest('.tl-item').querySelector('.tl-label').after(stepsDiv);
            }
            const row = document.createElement('div');
            row.className = 'tl-step';
            row.innerHTML = `<div class="tl-step-dot"></div><span>${esc(data.step.step_text)}</span>`;
            stepsDiv.appendChild(row);
            form.classList.remove('open');
            form.querySelector('.tl-add-input').value = '';
            body.querySelector(`.tl-add-btn[data-bid="${bid}"]`).style.display = '';
          } else {
            saveBtn.disabled = false; saveBtn.textContent = 'Save';
          }
          return;
        }
      });

      const gb = document.getElementById('pg-grad-start');
      if (gb) gb.addEventListener('click', async () => {
        gb.disabled = true; gb.textContent = 'Starting...';
        const { ok } = await api('/api/member/graduation/start', 'POST');
        if (ok) location.href = '/intake?round=2';
        else { gb.disabled = false; gb.textContent = 'Begin exit interview'; }
      });
    }

    // ---- Chart ----
    async function loadChart() {
      const body = document.getElementById('chart-body');
      const { data } = await api('/api/intake/data');
      let arr = data && data.session && data.session.chartSections;
      if (typeof arr === 'string') { try { arr = JSON.parse(arr); } catch (e) { arr = null; } }

      let html = (!arr || !arr.length)
        ? '<p class="sp-empty">Your Navigation Chart builds as you complete the interview. Finish a stage and it appears here.</p>'
        : arr.map(s => `<div class="chart-sec"><div class="chart-sec-t">${esc(s.title)}</div><div class="chart-sec-b">${esc(s.body)}</div></div>`).join('');

      // Ongoing appended note: how the benchmark ratings have moved since the start.
      try {
        const pr = await api('/api/member/progress');
        const moved = ((pr.data && pr.data.benchmarks) || [])
          .filter(b => b.current_rating != null && b.starting_rating != null && b.current_rating !== b.starting_rating);
        if (moved.length) {
          html += '<div class="chart-sec"><div class="chart-sec-t">Since you started</div><div class="chart-sec-b">' +
            moved.map(b => `&#8226; ${esc(b.statement)} — moved from ${b.starting_rating} to ${b.current_rating}.`).join('<br>') +
            '</div></div>';
        }
      } catch (e) { /* non-fatal */ }

      body.innerHTML = html;
    }

    // ---- Init ----
    (async function () {
      try { if (window.Clerk && !window.Clerk.loaded) await window.Clerk.load(); }
      catch (e) { location.href = '/login'; return; }

      // Tier + onboarding gates (client-side; server also guards).
      try {
        const me = await api('/api/auth/me');
        if (me.ok && me.data && me.data.membershipTier === 'free') { location.href = '/subscribe'; return; }
      } catch (e) {}
      let stages = {};
      try {
        const pr = await api('/api/member/progress');
        if (pr.data && pr.data.authenticated !== false && pr.data.stages) {
          stages = pr.data.stages;
          if (!stages.stage_1) { location.replace('/intake'); return; }
        }
      } catch (e) {}

      showBanner(stages);
      const savedPanel = parseInt(sessionStorage.getItem('earlPanel') || '1', 10);
      sessionStorage.removeItem('earlPanel');
      goTo(isNaN(savedPanel) ? 1 : savedPanel);
      loadHistory();
      loadProgress();
      loadChart();
      fetch('/api/version').then(r => r.json()).then(d => {
        const el = document.getElementById('app-version');
        if (el) el.textContent = 'v' + d.version;
      }).catch(() => {});
    })();
  </script>
  <script src="/js/checkin.js"></script>
</body>
</html>
