<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    html, body { overflow: visible !important; height: auto !important; background: #f5f0e8 !important; color: #0a0a0f !important; }
    .gd-page { max-width: 640px; margin: 0 auto; padding: 48px 20px 80px; }
    .gd-back { font-family: var(--font-ui); font-size: var(--text-sm); color: #7a7570; text-decoration: none; display: inline-block; margin-bottom: 24px; }
    .gd-back:hover { color: #3a3530; }
    .gd-title { font-family: var(--font-ui); font-size: 1.5rem; font-weight: 600; color: #0a0a0f; margin-bottom: 12px; line-height: 1.3; }
    .gd-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .gd-chip { font-family: var(--font-data); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 10px; border-radius: 2px; }
    .gd-chip-amount { background: #1a1a26; color: #c8b89a; }
    .gd-chip-match-high { background: #5a8a6a; color: #f0ebe0; }
    .gd-chip-match-med { background: #8a7a5a; color: #f0ebe0; }
    .gd-chip-open { background: #5a8a6a; color: #f0ebe0; }
    .gd-chip-rolling { background: #6a7a8a; color: #f0ebe0; }
    .gd-chip-deadline { background: #8a6a3a; color: #f0ebe0; }
    .gd-chip-closed { background: #8a3a3a; color: #f0ebe0; }
    .gd-source { font-family: var(--font-data); font-size: 10px; color: #7a7570; word-break: break-all; margin-bottom: 8px; }
    .gd-source a { color: #7a7570; }
    .gd-stale-notice { font-family: var(--font-ui); font-size: 11px; color: #8a6a3a; background: #f0e8d8; border-radius: 4px; padding: 8px 12px; margin-bottom: 16px; }
    .gd-section-title { font-family: var(--font-data); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #7a7570; margin-top: 32px; margin-bottom: 12px; }
    .gd-disclaimer { font-family: var(--font-ui); font-size: 11px; color: #7a7570; font-style: italic; border-left: 2px solid #c8c0b0; padding-left: 12px; margin-bottom: 16px; line-height: 1.5; }
    .gd-form-card { background: #ece7dc; border: 1px solid #c8c0b0; border-radius: 6px; padding: 14px; margin-bottom: 10px; }
    .gd-form-name { font-family: var(--font-ui); font-size: 13px; font-weight: 500; color: #0a0a0f; }
    .gd-form-desc { font-family: var(--font-ui); font-size: 12px; color: #3a3530; margin-top: 4px; }
    .gd-form-dl { font-family: var(--font-ui); font-size: 12px; color: #3a3530; background: none; border: 1px solid #c8c0b0; border-radius: 4px; padding: 6px 14px; margin-top: 8px; display: inline-block; text-decoration: none; cursor: pointer; }
    .gd-form-dl:hover { border-color: #3a3530; }
    .gd-text { font-family: var(--font-ui); font-size: 13px; color: #0a0a0f; line-height: 1.55; }
    .gd-text-muted { font-family: var(--font-ui); font-size: 13px; color: #7a7570; line-height: 1.55; }
    .gd-btn-primary { font-family: var(--font-ui); font-size: 13px; font-weight: 500; color: #f0ebe0; background: #0a0a0f; border: none; border-radius: 4px; padding: 10px 24px; text-decoration: none; display: inline-block; cursor: pointer; }
    .gd-copy-btn { font-family: var(--font-data); font-size: 10px; color: #7a7570; background: none; border: 1px solid #c8c0b0; border-radius: 2px; padding: 2px 8px; cursor: pointer; margin-left: 8px; }
    .gd-contact-row { font-family: var(--font-ui); font-size: 13px; color: #0a0a0f; margin-bottom: 6px; }
    .gd-contact-label { font-family: var(--font-data); font-size: 10px; color: #7a7570; text-transform: uppercase; letter-spacing: 0.08em; }

    /* Score breakdown */
    .gd-score-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #e8e3d8; font-family: var(--font-ui); font-size: 13px; }
    .gd-score-label { color: #3a3530; }
    .gd-score-value { font-family: var(--font-data); font-weight: 600; }
    .gd-score-full { color: #5a8a6a; }
    .gd-score-partial { color: #8a7a5a; }
    .gd-score-zero { color: #8a3a3a; }
    .gd-score-total { font-weight: 600; font-size: 14px; border-top: 2px solid #3a3530; margin-top: 4px; padding-top: 8px; }
    .gd-improve-list { list-style: none; padding: 0; margin-top: 16px; }
    .gd-improve-list li { font-family: var(--font-ui); font-size: 12px; color: #3a3530; padding: 8px 0; border-bottom: 1px solid #e8e3d8; line-height: 1.5; }

    /* Action buttons */
    .gd-actions { margin-top: 32px; display: flex; gap: 12px; flex-wrap: wrap; }
    .gd-btn-apply { font-family: var(--font-ui); font-size: 13px; color: #3a3530; background: none; border: 1px solid #c8c0b0; border-radius: 4px; padding: 10px 24px; cursor: pointer; }
    .gd-btn-received { font-family: var(--font-ui); font-size: 13px; color: #3a3530; background: none; border: 1px solid #c8c0b0; border-radius: 4px; padding: 10px 24px; cursor: pointer; }
    .gd-inline-form { margin-top: 16px; }
    .gd-inline-form label { font-family: var(--font-ui); font-size: 12px; color: #3a3530; display: block; margin-bottom: 4px; }
    .gd-inline-form input { font-family: var(--font-ui); font-size: 13px; padding: 8px 10px; border: 1px solid #c8c0b0; border-radius: 4px; background: #ece7dc; }
  </style>
