<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Bridge — Sign In</title>
  <link rel="stylesheet" href="/css/global.css">
  <style>
    html, body {
      overflow: visible !important;
      height: auto !important;
      background: #f0ebe0 !important;
      color: #08080f !important;
    }
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .login-card {
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .login-title {
      font-family: var(--font-ui);
      font-size: var(--text-lg);
      font-weight: 500;
      color: #08080f;
      margin-bottom: 8px;
    }
    .login-subtitle {
      font-family: var(--font-ui);
      font-size: var(--text-sm);
      color: rgba(8, 8, 15, 0.5);
      margin-bottom: 32px;
      line-height: 1.5;
    }
    #clerk-auth {
      min-height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Style Clerk's embedded component for light background */
    #clerk-auth .cl-rootBox {
      --clerk-font-family: 'Space Grotesk', sans-serif;
    }
    .login-alt {
      margin-top: 24px;
      font-family: var(--font-ui);
      font-size: var(--text-sm);
      color: rgba(8, 8, 15, 0.4);
    }
    .login-alt a {
      color: #08080f;
      text-decoration: underline;
    }
    .login-back {
      position: absolute;
      top: 24px;
      left: 24px;
      font-family: var(--font-data);
      font-size: 11px;
      letter-spacing: 0.08em;
      color: rgba(8, 8, 15, 0.5);
      text-decoration: none;
    }
    .login-back:hover {
      color: #08080f;
    }
    /* Fallback form styling */
    .fallback-card {
      border: 1px solid rgba(8, 8, 15, 0.1);
      border-radius: 8px;
      padding: 28px 24px;
      max-width: 360px;
      width: 100%;
      margin: 0 auto;
      text-align: left;
    }
    .fallback-card p {
      font-family: var(--font-ui);
      font-size: var(--text-sm);
      color: rgba(8, 8, 15, 0.6);
      margin-bottom: 16px;
    }
    .fallback-card input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid rgba(8, 8, 15, 0.15);
      border-radius: 8px;
      font-family: var(--font-ui);
      font-size: var(--text-base);
      background: #fff;
      color: #08080f;
      margin-bottom: 12px;
      outline: none;
    }
    .fallback-card input:focus {
      border-color: rgba(8, 8, 15, 0.4);
    }
    .fallback-card input::placeholder {
      color: rgba(8, 8, 15, 0.3);
    }
    .fallback-btn {
      width: 100%;
      font-family: var(--font-ui);
      font-size: var(--text-base);
      font-weight: 500;
      letter-spacing: var(--tracking-ui);
      color: #f0ebe0;
      background: #08080f;
      border: none;
      border-radius: 8px;
      padding: 14px 32px;
      min-height: 48px;
      cursor: pointer;
      text-align: center;
    }
    .fallback-btn:active { background: #1e1e2a; }
    .fallback-btn:disabled { opacity: 0.5; cursor: default; }
    .fallback-msg {
      display: none;
      margin-top: 14px;
      font-family: var(--font-ui);
      font-size: var(--text-sm);
      text-align: center;
    }
  </style>
</head>
<body>
  <a href="/" class="login-back">← Back</a>
  <div class="login-page">
    <div class="login-card">
      <h1 class="login-title">Sign in to The Bridge</h1>
      <p class="login-subtitle">Sign in or create an account to save your progress, access the dashboard, and unlock the Commander.</p>

      <div id="clerk-auth"></div>

      <p class="login-alt">
        Just want to explore? <a href="/simulator">Launch the free Simulator</a>
      </p>
    </div>
  </div>

  <script>
    const CLERK_PK = 'pk_live_Y2xlcmsuY2FwdGFpbnNicmlkZ2UuaW8k';
    const clerkDomain = atob(CLERK_PK.split('_')[2]).slice(0, -1);

    async function initClerk() {
      const authDiv = document.getElementById('clerk-auth');
      try {
        // 1. Load Clerk core
        const { Clerk } = await import(`https://${clerkDomain}/npm/@clerk/clerk-js@latest/dist/clerk.browser.js`);
        
        // 2. Load UI bundle (required for mountSignIn)
        await new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = `https://${clerkDomain}/npm/@clerk/ui@1/dist/ui.browser.js`;
          script.async = true;
          script.crossOrigin = 'anonymous';
          script.onload = resolve;
          script.onerror = () => reject(new Error('Failed to load Clerk UI'));
          document.head.appendChild(script);
        });

        // 3. Initialize with UI
        const clerk = new Clerk(CLERK_PK);
        await clerk.load({
          ui: { ClerkUI: window.__internal_ClerkUICtor }
        });

        if (clerk.user) {
          const params = new URLSearchParams(window.location.search);
          window.location.href = params.get('return') || '/dashboard';
          return;
        }

        clerk.mountSignIn(authDiv, {
          afterSignInUrl: '/dashboard',
          afterSignUpUrl: '/dashboard',
          appearance: {
            variables: {
              colorPrimary: '#08080f',
              colorText: '#08080f',
              colorBackground: '#f0ebe0',
              fontFamily: "'Space Grotesk', sans-serif",
              borderRadius: '8px'
            }
          }
        });
      } catch (e) {
        console.error('Clerk failed:', e);
        authDiv.innerHTML = `
          <div class="fallback-card">
            <p>Sign-in failed to load: ${e.message}</p>
            <a href="/" class="fallback-btn" style="display:block;text-align:center;text-decoration:none;margin-top:16px;">Back to The Bridge</a>
          </div>
        `;
      }
    }

    initClerk();
  </script>
</body>
</html>
