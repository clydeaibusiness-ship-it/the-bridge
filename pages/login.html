<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Bridge — Sign In</title>
  <script>
    // Clerk hosts the sign-in UI at accounts.captainsbridge.io
    // No JS loading, no UI bundles, no CSP issues — just redirect.
    const params = new URLSearchParams(window.location.search);
    const returnTo = params.get('return') || '/dashboard';
    const base = 'https://accounts.captainsbridge.io/sign-in';
    window.location.replace(base + '?redirect_url=' + encodeURIComponent('https://captainsbridge.io' + returnTo));
  </script>
</head>
<body></body>
</html>
