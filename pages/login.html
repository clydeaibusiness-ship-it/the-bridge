<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Bridge — Sign In</title>
  <script>
    const params = new URLSearchParams(window.location.search);
    const isProd = window.location.hostname === 'captainsbridge.io' || window.location.hostname === 'www.captainsbridge.io';
    const base = isProd
      ? 'https://accounts.captainsbridge.io/sign-up'
      : 'https://obliging-python-5.accounts.dev/sign-up';

    if (params.get('action') === 'subscribe') {
      window.location.replace(base + '?redirect_url=' + encodeURIComponent(window.location.origin + '/subscribe'));
    } else {
      const returnTo = params.get('return') || '/dashboard';
      window.location.replace(base + '?redirect_url=' + encodeURIComponent(window.location.origin + returnTo));
    }
  </script>
</head>
<body></body>
</html>
