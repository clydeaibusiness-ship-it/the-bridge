<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Bridge — Sign In</title>
  <link rel="stylesheet" href="/css/global.css">
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .login-card {
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .login-title {
      font-size: var(--text-xl);
      margin-bottom: var(--space-sm);
    }
    .login-subtitle {
      font-size: var(--text-sm);
      color: var(--color-ink-ghost);
      margin-bottom: var(--space-xl);
    }
    /* Clerk component container */
    #clerk-auth {
      min-height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-alt {
      margin-top: var(--space-lg);
      font-size: var(--text-xs);
      color: var(--color-ink-ghost);
    }
    .login-alt a {
      color: var(--color-ink-light);
    }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <h1 class="login-title">Welcome, Captain.</h1>
      <p class="login-subtitle">Sign in or create an account to save your progress, access the dashboard, and unlock the Commander.</p>

      <div id="clerk-auth"></div>

      <p class="login-alt">
        Just want to play? <a href="/game">Launch the free Simulator</a>
      </p>
    </div>
  </div>

  <script
    async
    crossorigin="anonymous"
    data-clerk-publishable-key="pk_test_b2JsaWdpbmctcHl0aG9uLTUuY2xlcmsuYWNjb3VudHMuZGV2JA"
    src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
    type="text/javascript"
  ></script>
  <script>
    window.addEventListener('load', async () => {
      await window.Clerk.load();

      if (window.Clerk.user) {
        // Already signed in — redirect to dashboard
        const params = new URLSearchParams(window.location.search);
        const returnUrl = params.get('return') || '/dashboard';
        window.location.href = returnUrl;
        return;
      }

      // Mount the sign-in component
      const authDiv = document.getElementById('clerk-auth');
      window.Clerk.mountSignIn(authDiv, {
        afterSignInUrl: '/dashboard',
        afterSignUpUrl: '/dashboard',
        signUpUrl: '/login',
      });
    });
  </script>
</body>
</html>
