<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Bridge — Sign In</title>
  <script>
    // Fetch Clerk config from server so dev and production use correct URLs
    var x = new XMLHttpRequest();
    x.open('GET', '/api/clerk-config', false);
    x.send();
    var cfg = x.status === 200 ? JSON.parse(x.responseText) : {};
    var base = (cfg.accountsUrl || 'https://accounts.captainsbridge.io') + '/sign-up';
    var origin = cfg.origin || 'https://captainsbridge.io';

    var params = new URLSearchParams(window.location.search);
    if (params.get('action') === 'subscribe') {
      window.location.replace(base + '?redirect_url=' + encodeURIComponent(origin + '/subscribe'));
    } else {
      var returnTo = params.get('return') || '/dashboard';
      window.location.replace(base + '?redirect_url=' + encodeURIComponent(origin + returnTo));
    }
  </script>
</head>
<body></body>
</html>
