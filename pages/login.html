<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Bridge — Sign In</title>
  <link rel="stylesheet" href="/css/global.css">
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .login-card {
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .login-title {
      font-size: var(--text-xl);
      margin-bottom: var(--space-sm);
    }
    .login-subtitle {
      font-size: var(--text-sm);
      color: var(--color-ink-ghost);
      margin-bottom: var(--space-xl);
    }
    /* Clerk component container */
    #clerk-auth {
      min-height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-alt {
      margin-top: var(--space-lg);
      font-size: var(--text-xs);
      color: var(--color-ink-ghost);
    }
    .login-alt a {
      color: var(--color-ink-light);
    }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <h1 class="login-title">Welcome, Captain.</h1>
      <p class="login-subtitle">Sign in or create an account to save your progress, access the dashboard, and unlock the Commander.</p>

      <div id="clerk-auth"></div>

      <p class="login-alt">
        Just want to play? <a href="/game">Launch the free Simulator</a>
      </p>
    </div>
  </div>

  <script>
    // Load Clerk dynamically
    const CLERK_PK = 'pk_test_b2JsaWdpbmctcHl0aG9uLTUuY2xlcmsuYWNjb3VudHMuZGV2JA';

    async function initClerk() {
      const authDiv = document.getElementById('clerk-auth');

      try {
        // Import Clerk from their official CDN
        const { Clerk } = await import('https://cdn.jsdelivr.net/npm/@clerk/clerk-js/+esm');
        const clerk = new Clerk(CLERK_PK);
        await clerk.load();

        if (clerk.user) {
          const params = new URLSearchParams(window.location.search);
          const returnUrl = params.get('return') || '/dashboard';
          window.location.href = returnUrl;
          return;
        }

        clerk.mountSignIn(authDiv, {
          afterSignInUrl: '/dashboard',
          afterSignUpUrl: '/dashboard',
        });
      } catch (e) {
        console.error('Clerk failed:', e);
        showFallbackForm(authDiv);
      }
    }

    function showFallbackForm(container) {
      container.innerHTML = `
        <div style="border:1px solid var(--color-border);border-radius:2px;padding:2rem;max-width:360px;width:100%;margin:0 auto;">
          <p style="margin-bottom:1rem;font-size:14px;color:var(--color-ink-light);">Enter your email to sign in or create an account.</p>
          <form id="magic-form">
            <input id="magic-email" name="email" type="email" required placeholder="your@email.com" style="width:100%;padding:0.75rem 1rem;border:1px solid var(--color-border);border-radius:2px;font-family:var(--font-primary);font-size:14px;margin-bottom:0.75rem;background:var(--color-paper-bright);color:var(--color-ink);">
            <button type="submit" class="btn-primary" id="magic-btn" style="width:100%;text-align:center;">Send Sign-In Link</button>
          </form>
          <p id="login-msg" style="display:none;margin-top:1rem;font-size:13px;text-align:center;"></p>
        </div>
      `;

      document.getElementById('magic-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('magic-email').value.trim();
        const btn = document.getElementById('magic-btn');
        const msg = document.getElementById('login-msg');
        if (!email) return;

        btn.textContent = 'Sending...';
        btn.disabled = true;

        try {
          const res = await fetch('/api/auth/magic-link', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });
          const data = await res.json();

          if (res.ok && data.sent) {
            msg.textContent = '✓ Check your email for a sign-in link.';
            msg.style.color = 'var(--color-safe)';
            msg.style.display = 'block';
            btn.textContent = 'Link Sent';
          } else {
            msg.textContent = data.error || 'Something went wrong. Try again.';
            msg.style.color = 'var(--color-alert)';
            msg.style.display = 'block';
            btn.textContent = 'Send Sign-In Link';
            btn.disabled = false;
          }
        } catch (err) {
          msg.textContent = 'Connection failed. Try again.';
          msg.style.color = 'var(--color-alert)';
          msg.style.display = 'block';
          btn.textContent = 'Send Sign-In Link';
          btn.disabled = false;
        }
      });
    }

    initClerk();
  </script>
</body>
</html>
