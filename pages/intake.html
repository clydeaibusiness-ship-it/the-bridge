<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Bridge — The Interview</title>
  <script>var _isProd = location.hostname === 'captainsbridge.io' || location.hostname === 'www.captainsbridge.io'; window.__clerk_publishable_key = _isProd ? 'pk_live_Y2xlcmsuY2FwdGFpbnNicmlkZ2UuaW8k' : 'pk_test_b2JsaWdpbmctcHl0aG9uLTUuY2xlcmsuYWNjb3VudHMuZGV2JA';</script>
  <script src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js"></script>
  <script src="/js/session.js"></script>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/nav.css">
  <style>
    html, body { overflow: visible !important; height: auto !important; background: #f5f0e8 !important; color: #0a0a0f !important; }
    .iv-page { max-width: 540px; margin: 0 auto; padding: 40px 20px 80px; }
    .iv-stages { display: flex; gap: 10px; margin-bottom: 2rem; }
    .iv-stage { flex: 1; }
    .iv-stage-meta { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
    .iv-stage-name { font-family: var(--font-data); font-size: 0.5625rem; letter-spacing: 0.1em; text-transform: uppercase; color: #3a3530; font-weight: 600; }
    .iv-stage-time { font-family: var(--font-data); font-size: 0.5rem; letter-spacing: 0.06em; color: #b0a898; }
    .iv-stage-track { height: 4px; background: #e0d8c8; border-radius: 2px; overflow: hidden; margin-bottom: 5px; }
    .iv-stage-fill { height: 100%; background: #8a6830; width: 0; transition: width 0.4s ease; }
    .iv-stage.complete .iv-stage-fill { background: #5a7a50; }
    .iv-stage-sub { font-family: var(--font-data); font-size: 0.5rem; letter-spacing: 0.06em; text-transform: uppercase; color: #b0a898; }
    .iv-framing { font-family: var(--font-ui); font-size: 0.875rem; color: #3a3530; line-height: 1.7; white-space: pre-line; margin-bottom: 1.75rem; }
    .iv-q { font-family: var(--font-ui); font-size: 1.0625rem; color: #0a0a0f; line-height: 1.5; margin-bottom: 1.25rem; }
    .iv-q-kicker { font-family: var(--font-data); font-size: 0.5625rem; letter-spacing: 0.1em; text-transform: uppercase; color: #9a948a; margin-bottom: 0.6rem; }
    .iv-input { width: 100%; box-sizing: border-box; font-family: var(--font-ui); font-size: 1rem; color: #0a0a0f;
      background: #ece7dc; border: 1px solid #c8c0b0; border-radius: 6px; padding: 12px 14px; min-height: 90px; outline: none; resize: vertical; }
    .iv-input:focus { border-color: #3a3530; }
    .iv-btn { font-family: var(--font-ui); font-size: 1rem; font-weight: 500; letter-spacing: 0.04em; color: #f0ebe0; background: #0a0a0f;
      border: none; border-radius: 6px; padding: 13px 28px; min-height: 48px; cursor: pointer; margin-top: 1rem; }
    .iv-btn:active { transform: scale(0.98); }
    .iv-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .iv-btn-ghost { background: transparent; color: #3a3530; border: 1px solid #c8c0b0; margin-left: 0.6rem; }
    .iv-msg { font-family: var(--font-ui); font-size: 0.95rem; color: #2a2520; line-height: 1.7; white-space: pre-line; margin-bottom: 1.25rem; }
    .iv-followup-note { font-family: var(--font-data); font-size: 0.5625rem; letter-spacing: 0.1em; text-transform: uppercase; color: #8a6830; margin-bottom: 0.6rem; }
    .iv-bench { margin-bottom: 0.9rem; }
    .iv-bench textarea { width: 100%; box-sizing: border-box; font-family: var(--font-ui); font-size: 0.9rem; color: #0a0a0f; background: #ece7dc; border: 1px solid #c8c0b0; border-radius: 6px; padding: 10px 12px; min-height: 56px; resize: vertical; }
    .iv-bench-remove { background: none; border: none; color: #9a7050; font-family: var(--font-data); font-size: 0.5625rem; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; margin-top: 0.2rem; }
    .iv-loading { font-family: var(--font-data); font-size: 0.625rem; letter-spacing: 0.1em; text-transform: uppercase; color: #9a948a; margin-top: 1rem; }
  </style>
</head>
<body>
  <nav class="site-nav">
    <a href="/" class="site-nav-brand"><span class="site-nav-brand-text">THE BRIDGE</span><span class="beta-chip">BETA</span></a>
    <div class="site-nav-links">
      <a href="/dashboard">Dashboard</a>
      <span class="site-nav-sep">|</span>
      <a href="/progress">Progress</a>
      <span class="site-nav-sep">|</span>
      <a href="/api/auth/logout">Sign Out</a>
    </div>
    <button class="site-nav-hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
    <div class="site-nav-mobile" id="mobile-menu"><button class="site-nav-mobile-close" aria-label="Close">✕</button>
      <a href="/dashboard">Dashboard</a>
      <a href="/progress">Progress</a>
      <a href="/api/auth/logout">Sign Out</a>
    </div>
  </nav>

  <div class="iv-page">
    <div class="iv-stages" id="iv-stages">
      <div class="iv-stage" id="iv-s1">
        <div class="iv-stage-meta"><span class="iv-stage-name">Stage 1</span><span class="iv-stage-time">~5 min</span></div>
        <div class="iv-stage-track"><div class="iv-stage-fill" id="iv-s1-fill"></div></div>
        <div class="iv-stage-sub">Quick Start</div>
      </div>
      <div class="iv-stage" id="iv-s2">
        <div class="iv-stage-meta"><span class="iv-stage-name">Stage 2</span><span class="iv-stage-time">~10 min</span></div>
        <div class="iv-stage-track"><div class="iv-stage-fill" id="iv-s2-fill"></div></div>
        <div class="iv-stage-sub">Operational Reality</div>
      </div>
      <div class="iv-stage" id="iv-s3">
        <div class="iv-stage-meta"><span class="iv-stage-name">Stage 3</span><span class="iv-stage-time">~8 min</span></div>
        <div class="iv-stage-track"><div class="iv-stage-fill" id="iv-s3-fill"></div></div>
        <div class="iv-stage-sub">Full Picture</div>
      </div>
    </div>
    <div id="iv-panel">
      <div class="iv-loading">Loading the interview…</div>
    </div>
  </div>

  <script>
    const panel = document.getElementById('iv-panel');
    const s1El = document.getElementById('iv-s1');
    const s2El = document.getElementById('iv-s2');
    const s3El = document.getElementById('iv-s3');
    const collected = {}; // field -> answer, kept locally for the dashboard signal
    const ROUND = new URLSearchParams(location.search).get('round') === '2' ? 2 : 1;

    const esc = (s) => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

    async function api(path, method, body) {
      const opts = { method, headers: { 'Content-Type': 'application/json' } };
      if (body) opts.body = JSON.stringify(body);
      const r = await fetch(path, opts);
      return r.ok ? r.json() : null;
    }

    function setProgress(p) {
      if (!p) return;
      const a = p.answered;
      document.getElementById('iv-s1-fill').style.width = Math.round(Math.min(a, 8) / 8 * 100) + '%';
      document.getElementById('iv-s2-fill').style.width = Math.round(Math.max(0, Math.min(a - 8, 13)) / 13 * 100) + '%';
      document.getElementById('iv-s3-fill').style.width = Math.round(Math.max(0, Math.min(a - 21, 10)) / 10 * 100) + '%';
      if (a >= 8)  s1El.classList.add('complete');
      if (a >= 21) s2El.classList.add('complete');
      if (a >= 31) s3El.classList.add('complete');
    }

    // Signal the dashboard that the member has cleared the gate (after Stage 1).
    async function markStarted() {
      try {
        await BridgeSession.save({
          businessName: collected['business_name'] || undefined,
          shipName: collected['business_name'] || undefined,
          completedAt: new Date().toISOString()
        });
      } catch (e) { /* non-fatal */ }
    }

    function renderQuestion(q, framing) {
      let html = '';
      if (framing) html += '<div class="iv-framing">' + esc(framing) + '</div>';
      html += '<div class="iv-q-kicker">' + (q.n <= 8 ? 'Stage 1 · Quick Start' : q.n <= 21 ? 'Stage 2 · Operational Reality' : 'Stage 3 · Full Picture') + '</div>';
      html += '<div class="iv-q">' + esc(q.text) + '</div>';
      html += '<textarea class="iv-input" id="iv-answer" autofocus></textarea>';
      html += '<div><button class="iv-btn" id="iv-submit">Continue</button></div>';
      panel.innerHTML = html;
      wireSubmit(q.field, false);
    }

    function renderFollowUp(field, followUpText) {
      let html = '<div class="iv-followup-note">One more thing</div>';
      html += '<div class="iv-q">' + esc(followUpText) + '</div>';
      html += '<textarea class="iv-input" id="iv-answer" autofocus></textarea>';
      html += '<div><button class="iv-btn" id="iv-submit">Continue</button></div>';
      panel.innerHTML = html;
      wireSubmit(field, true);
    }

    function wireSubmit(field, isFollowUp) {
      const btn = document.getElementById('iv-submit');
      const ta = document.getElementById('iv-answer');
      if (ta) ta.focus();
      btn.addEventListener('click', async () => {
        const answer = (ta.value || '').trim();
        if (!answer) { ta.focus(); return; }
        if (!isFollowUp) collected[field] = answer;
        btn.disabled = true;
        btn.textContent = 'Saving…';
        const data = await api('/api/member/interview/answer', 'POST', { field, answer, isFollowUp, round: ROUND });
        if (!data) { btn.disabled = false; btn.textContent = 'Continue'; return; }
        handleAnswerResult(field, data);
      });
    }

    async function handleAnswerResult(field, data) {
      if (data.followUp) { renderFollowUp(field, data.followUp); return; }

      // Exit interview (round 2): no stages or benchmark — go straight to the
      // certificate when finished.
      if (ROUND === 2) {
        if (data.done) { window.location.href = '/certificate'; return; }
        setProgress({ answered: data.question.n - 1, total: 31 });
        renderQuestion(data.question, data.framing);
        return;
      }

      // Stage 1 completion opens the dashboard.
      if (data.stageComplete && data.stages && data.stages.stage_1) await markStarted();

      if (data.benchmarkReady) { renderStageBridge(data.stageComplete, () => renderBenchmarkReview()); return; }
      if (data.stageComplete) {
        renderStageBridge(data.stageComplete, () => {
          if (data.done) { renderDone(); }
          else { setProgress(null); loadState(); }
        });
        return;
      }
      if (data.done) { renderDone(); return; }
      setProgress({ answered: data.question.n - 1, total: 31 });
      renderQuestion(data.question, data.framing);
    }

    // A transition card shown at stage boundaries with the option to stop.
    function renderStageBridge(message, onContinue) {
      let html = '<div class="iv-msg">' + esc(message || '') + '</div>';
      html += '<div><button class="iv-btn" id="iv-continue">Keep going</button>';
      html += '<button class="iv-btn iv-btn-ghost" id="iv-stop">Talk to Earl →</button></div>';
      panel.innerHTML = html;
      document.getElementById('iv-continue').addEventListener('click', onContinue);
      document.getElementById('iv-stop').addEventListener('click', () => { window.location.href = '/dashboard'; });
    }

    async function renderBenchmarkReview() {
      panel.innerHTML = '<div class="iv-loading">Building what you are working toward…</div>';
      const data = await api('/api/member/benchmark', 'GET');
      const benches = (data && data.benchmarks) ? data.benchmarks : [];
      if (!benches.length) { setProgress(null); loadState(); return; }

      let html = '<div class="iv-msg">Here is what I heard you are working toward, in your words. Do these capture it? Edit anything, or remove what does not fit.</div>';
      benches.forEach((b, i) => {
        html += '<div class="iv-bench" data-i="' + i + '"><textarea>' + esc(b.statement) + '</textarea>' +
          '<button class="iv-bench-remove" data-remove="' + i + '">Remove</button></div>';
      });
      html += '<div><button class="iv-btn" id="iv-approve">These are right</button></div>';
      panel.innerHTML = html;

      panel.querySelectorAll('[data-remove]').forEach(btn => {
        btn.addEventListener('click', () => {
          const row = btn.closest('.iv-bench');
          if (row && panel.querySelectorAll('.iv-bench').length > 1) row.remove();
        });
      });

      document.getElementById('iv-approve').addEventListener('click', async () => {
        const statements = Array.from(panel.querySelectorAll('.iv-bench textarea'))
          .map(t => t.value.trim()).filter(Boolean);
        if (!statements.length) return;
        const btn = document.getElementById('iv-approve');
        btn.disabled = true; btn.textContent = 'Saving…';
        await api('/api/member/benchmark/approve', 'POST', { statements });
        // Stage 2 done — offer Stage 3 or Earl.
        renderStageBridge('That is locked in. Stage 3 is the most personal stage and the most important one. Take it now, or come back to it when you are ready.',
          () => { setProgress(null); loadState(); });
      });
    }

    function renderDone() {
      setProgress({ answered: 30 });
      panel.innerHTML = '<div class="iv-msg">That is everything. Earl now has the full picture. Go have a real conversation.</div>' +
        '<div><a class="iv-btn" href="/dashboard" style="display:inline-block;text-decoration:none;">Talk to Earl →</a></div>';
    }

    async function loadState() {
      const data = await api('/api/member/interview/state' + (ROUND === 2 ? '?round=2' : ''), 'GET');
      if (!data || data.authenticated === false) {
        panel.innerHTML = '<div class="iv-msg">Please <a href="/login">sign in</a> to begin.</div>';
        return;
      }
      if (data.done) {
        if (ROUND === 2) { window.location.href = '/certificate'; return; }
        renderDone(); return;
      }
      if (ROUND === 2 && data.question && data.question.n === 1) {
        // Exit-interview preamble before the first question.
        panel.innerHTML = '<div class="iv-msg">This is the same interview you started with — the same questions, a fresh set of answers. Do not look back at what you said before. Just answer as you are today. When you finish, you will see how far you have come.</div>' +
          '<div><button class="iv-btn" id="iv-begin">Begin</button></div>';
        document.getElementById('iv-begin').addEventListener('click', () => {
          setProgress(data.progress);
          renderQuestion(data.question, null);
        });
        return;
      }
      setProgress(data.progress);
      renderQuestion(data.question, data.framing);
    }

    (async function () {
      try { if (window.Clerk && !window.Clerk.loaded) await window.Clerk.load(); }
      catch (e) { console.log('Clerk init:', e.message); }
      loadState();
    })();
  </script>
  <script src="/js/nav.js"></script>
</body>
</html>
